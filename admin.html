<!doctype html>
<html lang="so">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1118">
<meta name="robots" content="noindex">
<title>HantiGo Maamul</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=Figtree:wght@400;600&display=swap">
<style>
:root{--bg:#f3f6fa;--surface:#fff;--ink:#14202e;--muted:#5b6b7e;--line:#dbe3ec;--accent:#2f6fc4;--accent-soft:#e3edf9;--in:#16794a;--in-soft:#e2f3ea;--out:#b3402a;--out-soft:#f8e6e1;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;--body:"Figtree",ui-sans-serif,system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#0f1620;--surface:#17212d;--ink:#e8eef5;--muted:#93a3b5;--line:#2a3746;--accent:#6aa5ec;--accent-soft:#1d3048;--in:#4cc58a;--in-soft:#173527;--out:#ef8a72;--out-soft:#3a201a;color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);font-variant-numeric:tabular-nums}
.wrap{max-width:1000px;margin:0 auto;padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:16px}
h1{font:700 1.6rem/1.1 var(--display);margin:0}h1 span{color:var(--accent)}
.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px}
a{color:var(--accent);font-weight:600}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:7px 12px}
button:hover{border-color:var(--accent)}
.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.stop{color:var(--out)}
input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat small{display:block;color:var(--muted);font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.stat b{font:700 1.4rem var(--display)}
.list{display:grid;gap:8px}
.row{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;align-items:center}
.who{min-width:0}.who b{overflow-wrap:anywhere}.who div{color:var(--muted);font-size:.85rem;overflow-wrap:anywhere}
.acts{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.pill{display:inline-block;padding:1px 9px;border-radius:99px;font-weight:600;font-size:.78rem;margin-left:6px}
.req .pill{align-self:flex-start;margin-left:0}
.pill.biz{background:#2a3f6b;color:#cfe0ff}.pill.per{background:#2c4a3a;color:#c8f0d8}
.ok{background:var(--in-soft);color:var(--in)}.warn{background:var(--out-soft);color:var(--out)}.trial{background:var(--accent-soft);color:var(--accent)}
.msg{color:var(--muted)}
@media (max-width:560px){.row{grid-template-columns:1fr}.acts{justify-content:flex-start}}
.locs{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.locbox{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}.locbox h3{margin:0 0 8px;font-size:1rem}.locrow{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--line);font-size:.92rem}.locrow:last-child{border:0}
.stats{grid-template-columns:repeat(auto-fit,minmax(120px,1fr))}
.stat em{display:block;font-style:normal;color:var(--in);font-size:.78rem;font-weight:600}
.cin{color:var(--in)}.cac{color:var(--accent)}.cout{color:var(--out)}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.tabs button{border:0;background:transparent;font-weight:600;color:var(--muted)}
.tabs button[aria-selected=true]{background:var(--accent);color:#fff}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.chips button{white-space:nowrap;border-radius:99px;padding:5px 12px;font-size:.88rem}
.chips button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.row{grid-template-columns:auto minmax(0,1fr) auto}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--accent-soft);color:var(--accent)}
.acts button{padding:5px 10px;font-size:.85rem}
@media (max-width:560px){.row{grid-template-columns:auto minmax(0,1fr)}.acts{grid-column:1/-1}}
.bar{display:grid;grid-template-columns:minmax(80px,30%) 1fr auto;gap:10px;align-items:center;padding:5px 0;font-size:.92rem}
.bar i{display:block;height:10px;border-radius:0 4px 4px 0;background:var(--accent);min-width:4px}
.bar b{min-width:2ch;text-align:right}
html:root{--bg:#0b1118;--surface:#141c26;--ink:#eef3f8;--muted:#8fa0b3;--line:#233041;--accent:#3ddc97;--accent-soft:#16352a;--in:#3ddc97;--in-soft:#14322a;--out:#ff7a66;--out-soft:#3a1f1b;color-scheme:dark}
.primary,.tabs button[aria-selected=true]{color:#06281a}
.stat,.row,.locbox{border-radius:16px}
.stat:first-child{background:linear-gradient(135deg,#123d2e,#0f2a3d);border-color:#1f5a44}
.reqs{background:var(--surface);border:2px solid #d4a017;border-radius:16px;padding:12px 14px;display:grid;gap:10px}
.reqs h2{margin:0;font-size:1.05rem}.req{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;align-items:center;border-top:1px solid var(--line);padding-top:10px}
.req .meta{font-size:.9rem;opacity:.85;display:grid;gap:2px}.req img{max-width:100%;max-height:260px;border-radius:8px;margin-top:6px;cursor:zoom-in}
.req .ok-b{background:#1e8e5a;color:#fff;border-color:#1e8e5a}.req .no-b{color:#e5534b}
@media (max-width:560px){.req{grid-template-columns:1fr}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
</head>
<body>
<div class="wrap">
  <div class="top"><h1>Hanti<span>Go</span> · Maamul</h1><a href="./">← Ku noqo app-ka</a></div>
  <p class="msg" id="msg">Waa la soo dejinayaa…</p>
  <div id="main" hidden style="display:grid;gap:14px">
    <section id="reqs" class="reqs" hidden></section>
    <div class="stats">
      <div class="stat"><small>Macaamiisha</small><b id="nAll">0</b><em id="nNew"></em></div>
      <div class="stat"><small>Bixiyay</small><b id="nPaid" class="cin">0</b></div>
      <div class="stat"><small>Tijaabo</small><b id="nTrial" class="cac">0</b></div>
      <div class="stat"><small>Dhacay</small><b id="nExp" class="cout">0</b></div>
      <div class="stat wide"><small>Dakhliga bishii</small><b id="mrr">$0</b></div>
    </div>
    <div class="tabs" role="tablist">
      <button type="button" role="tab" data-tab="cust" aria-selected="true">👥 Macaamiisha</button>
      <button type="button" role="tab" data-tab="loc" aria-selected="false">📍 Meelaha</button>
    </div>
    <section id="tabCust" style="display:grid;gap:10px">
      <input id="q" type="search" placeholder="Raadi email, lambar EVC ama magaalo…" aria-label="Raadi">
      <div class="chips" id="chips"></div>
      <div class="list" id="list"></div>
    </section>
    <section id="tabLoc" hidden><div class="locs" id="locs"></div></section>
  </div>
</div>
</div>
<script>
const sb=supabase.createClient("https://izcvgigmcqxkntsvxkhj.supabase.co","sb_publishable_Uzpl7gYnsQAvLVwvsyD7nA_ZhJt_XpZ");
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=d=>d?new Date(d).toLocaleDateString("en-GB"):"—";
let rows=[];
/* price by account type: Shakhsi $3, Shirkad $7 (Shirkad includes Shakhsi) */
const PRICE={person:3,business:7};
const planOf=p=>p.plan?(p.plan==="business"?"business":"person"):/\[Shirkad/i.test(p.pay_ref||"")?"business":/\[Shakhsi/i.test(p.pay_ref||"")?"person":null;
const priceOf=p=>PRICE[planOf(p)||"person"];
const planName=p=>planOf(p)==="business"?"Shirkad":"Shakhsi";
const planPill=p=>{const k=planOf(p);return `<span class="pill ${k==="business"?"biz":"per"}">${k?(k==="business"?"🏢 Shirkad $7":"👤 Shakhsi $3"):"? Nooc lama oga"}</span>`};
const cleanRef=r=>String(r||"").replace(/^(\[[^\]]*\]\s*)+/,"");
const payWay=p=>/\[WaafiPay\]/i.test(p.pay_ref||"")?"WaafiPay":"EVC Plus";
function status(p){const now=new Date();
  if(p.is_admin)return["Maamule","ok"];
  if(p.paid_until&&new Date(p.paid_until)>now)return["Bixiyay ilaa "+fmt(p.paid_until),"ok"];
  if(new Date(p.trial_until)>now)return["Tijaabo ilaa "+fmt(p.trial_until),"trial"];
  return["Dhacay","warn"]}
let filt="all",tab="cust";
const isPaid=p=>p.paid_until&&new Date(p.paid_until)>new Date();
const isTrial=p=>!isPaid(p)&&new Date(p.trial_until)>new Date();
const isNew=p=>p.created_at&&Date.now()-new Date(p.created_at)<7*864e5;
const FILTERS=[["all","Dhammaan",()=>true],["paid","Bixiyay",isPaid],["trial","Tijaabo",isTrial],["exp","Dhacay",p=>!isPaid(p)&&!isTrial(p)],["new","Cusub (7 maalmood)",isNew]];
function renderLocs(cust){
  if(cust.length&&!("city" in cust[0])){$("locs").innerHTML='<p class="msg">Si aad u aragto meelaha ay dadku joogaan, ku shub faylka <b>supabase/location.sql</b> gudaha Supabase (SQL Editor → Run).</p>';return}
  const box=(title,key)=>{const m={};cust.forEach(p=>{const v=p[key]||"Lama oga";m[v]=(m[v]||0)+1});
    const list=Object.entries(m).sort((a,b)=>b[1]-a[1]);const max=Math.max(1,...list.map(x=>x[1]));
    return `<div class="locbox"><h3>${title}</h3>${list.map(([k,n])=>`<div class="bar"><span>${esc(k)}</span><i style="width:${n/max*100}%"></i><b>${n}</b></div>`).join("")||'<p class="msg">Weli qofna</p>'}</div>`};
  $("locs").innerHTML=box("📍 Magaalooyinka","city")+box("🌍 Wadamada","country")}
function renderReqs(cust){
  const hasCol=cust.length&&("pay_status" in cust[0]);
  const reqs=cust.filter(p=>hasCol?p.pay_status==="pending":(p.phone&&!isPaid(p)));
  document.title=(reqs.length?"("+reqs.length+") ":"")+"HantiGo · Maamul";
  $("reqs").hidden=!reqs.length;
  $("reqs").innerHTML=`<h2>⏳ Codsiyada lacagta · ${reqs.length}</h2><p class="msg" style="margin:0">Hubi in lacagta (👤 Shakhsi <b>$3</b> · 🏢 Shirkad <b>$7</b>) ay ka timid lambarkan, kadib riix <b>Ansixi</b>. Akoonka 30 maalmood ayuu u furmayaa.</p>`+
    reqs.sort((a,b)=>String(b.pay_requested_at||"").localeCompare(String(a.pay_requested_at||""))).map(p=>`<div class="req"><div class="meta"><b>${esc(p.email)}</b>${planPill(p)}
      <span>📞 ${payWay(p)}: <b>${esc(p.phone||"—")}</b>${cleanRef(p.pay_ref)?` · 🧾 ${esc(cleanRef(p.pay_ref))}`:""}</span>
      <span>🕒 ${p.pay_requested_at?new Date(p.pay_requested_at).toLocaleString("en-GB",{dateStyle:"short",timeStyle:"short"}):"—"}</span>
      ${p.pay_shot?`<img src="${esc(p.pay_shot)}" alt="Sawirka fariinta EVC" data-zoom>`:""}</div>
      <div class="acts"><button class="ok-b" data-pay="${p.id}" data-ok="1">✓ Ansixi $${priceOf(p)} (30 maalmood)</button><button class="no-b" data-pay="${p.id}" data-ok="0">✕ Diid</button></div></div>`).join("")}
function render(){
  const q=$("q").value.trim().toLowerCase();
  const cust=rows.filter(p=>!p.is_admin);
  const paid=cust.filter(isPaid).length,trial=cust.filter(isTrial).length,nw=cust.filter(isNew).length;
  $("nAll").textContent=cust.length;$("nNew").textContent=nw?`+${nw} toddobaadkan`:"";$("nPaid").textContent=paid;$("nTrial").textContent=trial;$("nExp").textContent=cust.length-paid-trial;$("mrr").textContent="$"+cust.filter(isPaid).reduce((a,p)=>a+priceOf(p),0);
  $("chips").innerHTML=FILTERS.map(([k,t,f])=>`<button type="button" data-f="${k}" aria-pressed="${filt===k}">${t} · ${cust.filter(f).length}</button>`).join("");
  renderLocs(cust);renderReqs(cust);
  const fn=FILTERS.find(x=>x[0]===filt)[2];const qd=q.replace(/\D/g,"");
  const list=cust.filter(fn).filter(p=>!q||(p.email||"").toLowerCase().includes(q)||(p.city||"").toLowerCase().includes(q)||(qd&&(p.phone||"").replace(/\D/g,"").includes(qd)));
  $("list").innerHTML=list.length?list.map(p=>{const [t,c]=status(p);return `<div class="row">
    <div class="av" aria-hidden="true">${esc((p.email||"?")[0].toUpperCase())}</div>
    <div class="who"><b>${esc(p.email)}</b><span class="pill ${c}">${esc(t)}</span>${planPill(p)}
      <div>📍 ${esc([p.city,p.country].filter(Boolean).join(", ")||"lama oga")} · 📅 ${fmt(p.created_at)} · 📞 ${esc(p.phone||"—")}</div></div>
    <div class="acts"><button class="primary" data-id="${p.id}" data-d="30">+30 maalmood</button><button data-id="${p.id}" data-d="365">+1 sano</button><button class="stop" data-id="${p.id}" data-d="0">Jooji</button>${"plan" in p?`<button data-plan="${p.id}" data-to="${planOf(p)==="business"?"person":"business"}">→ ${planOf(p)==="business"?"👤 Shakhsi $3":"🏢 Shirkad $7"}</button>`:""}</div>
  </div>`}).join(""):`<p class="msg">Macmiil lama helin.</p>`}
document.addEventListener("click",e=>{const f=e.target.closest("[data-f]");if(f){filt=f.dataset.f;render();return}
  const t=e.target.closest("[data-tab]");if(t){tab=t.dataset.tab;document.querySelectorAll("[data-tab]").forEach(x=>x.setAttribute("aria-selected",x===t));$("tabCust").hidden=tab!=="cust";$("tabLoc").hidden=tab!=="loc"}});
async function load(){
  const {data,error}=await sb.from("profiles").select("*").order("created_at",{ascending:false});
  if(error){$("msg").textContent="Xogta lama soo saari karo: "+error.message;return}
  rows=data;$("msg").hidden=true;$("main").hidden=false;render()}
document.addEventListener("click",async e=>{const z=e.target.closest("[data-zoom]");if(z){window.open().document.write(`<img src="${z.src}" style="max-width:100%">`);return}
  const b=e.target.closest("[data-pay]");if(!b)return;const ok=b.dataset.ok==="1";
  if(!ok&&!b.dataset.sure){b.dataset.sure="1";b.textContent="Hubi? Diid";setTimeout(()=>{delete b.dataset.sure;b.textContent="✕ Diid"},3000);return}
  b.disabled=true;let {error}=await sb.rpc("admin_pay_decide",{target:b.dataset.pay,approve:ok,days:30});
  if(error&&ok)({error}=await sb.rpc("admin_extend",{target:b.dataset.pay,days:30}));
  if(error){alert(ok?"Khalad: "+error.message:"Si aad u diiddo, marka hore ku shub faylka supabase/payment.sql gudaha Supabase.");b.disabled=false;return}
  await load();if(ok){const p=rows.find(x=>x.id===b.dataset.pay);sendSubReceipt(b.dataset.pay,30,p?priceOf(p):3)}});
document.addEventListener("click",async e=>{const b=e.target.closest("[data-id]");if(!b)return;
  const d=Number(b.dataset.d);
  if(d===0&&!b.dataset.sure){b.dataset.sure="1";b.textContent="Hubi?";setTimeout(()=>{delete b.dataset.sure;b.textContent="Jooji"},3000);return}
  const cp=rows.find(x=>x.id===b.dataset.id)||{};let amt=0;if(d===30)amt=priceOf(cp);else if(d>=365){const v=prompt(`Imisa ayuu bixiyay sanadkan? ($)\n${planName(cp)}: $${priceOf(cp)} x 12 = $${priceOf(cp)*12}\nCancel = rasiid looma dirayo.`,String(priceOf(cp)*12));amt=v===null?0:(parseFloat(v)||0)}
  b.disabled=true;const {error}=await sb.rpc("admin_extend",{target:b.dataset.id,days:d});
  if(error){alert("Khalad: "+error.message);b.disabled=false;return}await load();if(amt>0)sendSubReceipt(b.dataset.id,d,amt)});

document.addEventListener("click",async e=>{const b=e.target.closest("[data-plan]");if(!b)return;
  b.disabled=true;const {error}=await sb.rpc("admin_set_plan",{target:b.dataset.plan,p:b.dataset.to});
  if(error){alert("Khalad: "+error.message);b.disabled=false;return}await load()});

/* ---------- subscription receipt: PDF by email to the customer, copy to the admin ---------- */
let pdfLib=null;
function loadPdf(){return pdfLib||(pdfLib=new Promise((res,rej)=>{if(window.jspdf)return res(window.jspdf.jsPDF);const sc=document.createElement("script");sc.src="vendor/jspdf.umd.min.js";
  sc.onload=()=>window.jspdf?res(window.jspdf.jsPDF):rej();sc.onerror=()=>{pdfLib=null;rej()};document.head.appendChild(sc)}))}
let logoUrl=null;
async function logo(){if(logoUrl!==null)return logoUrl;try{const b=await (await fetch("icon-192.png")).blob();logoUrl=await new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)})}catch{logoUrl=""}return logoUrl}
const dmy=d=>new Date(d).toLocaleDateString("en-GB");
async function subPdf(p,r){const J=await loadPdf();const doc=new J({unit:"mm",format:"a4"});const W=210,M=16;let y=18;
  const lg=await logo();if(lg){try{doc.addImage(lg,"PNG",M,y-6,20,20)}catch{}}
  doc.setFont("helvetica","bold");doc.setFontSize(20);doc.setTextColor(11,122,75);doc.text("HantiGo",M+25,y+3);
  doc.setFont("helvetica","normal");doc.setFontSize(9);doc.setTextColor(110);doc.text("hantigoapp.github.io",M+25,y+9);
  doc.setFont("helvetica","bold");doc.setFontSize(13);doc.setTextColor(40);doc.text("RASIID  "+r.no,W-M,y+2,{align:"right"});
  doc.setFont("helvetica","normal");doc.setFontSize(10);doc.setTextColor(90);doc.text("Taariikhda: "+dmy(r.date),W-M,y+8,{align:"right"});
  y+=24;doc.setDrawColor(200);doc.line(M,y,W-M,y);y+=8;
  doc.setTextColor(90);doc.text("Macmiilka",M,y);doc.setTextColor(20);doc.setFont("helvetica","bold");doc.setFontSize(12);doc.text(p.email||"",M,y+6);
  doc.setFont("helvetica","normal");doc.setFontSize(10);doc.setTextColor(90);
  const info=[p.phone?"EVC: "+p.phone:"",cleanRef(p.pay_ref)?"Tix: "+cleanRef(p.pay_ref).replace(/^\s*tix[:\s]*/i,""):""].filter(Boolean).join("   ·   ");if(info)doc.text(info,M,y+11);
  y+=22;doc.setFillColor(11,122,75);doc.rect(M,y-5,W-2*M,8,"F");doc.setTextColor(255);doc.setFont("helvetica","bold");
  doc.text("Adeegga",M+2,y);doc.text("Muddada",128,y);doc.text("Qiimaha",W-M-2,y,{align:"right"});
  doc.setFont("helvetica","normal");doc.setTextColor(20);y+=8;
  doc.text("HantiGo "+planName(p)+" - rukunka app-ka",M+2,y);doc.text(r.days>=365?"1 sano":r.days+" maalmood",128,y);doc.text("$"+r.amount.toFixed(2),W-M-2,y,{align:"right"});y+=6;
  doc.setDrawColor(11,122,75);doc.line(M,y,W-M,y);y+=8;doc.setFont("helvetica","bold");doc.setFontSize(13);
  doc.text("Wadarta",128,y);doc.text("$"+r.amount.toFixed(2),W-M-2,y,{align:"right"});y+=12;
  doc.setFontSize(11);doc.setTextColor(11,122,75);doc.text("Waa la bixiyay ("+payWay(p)+"). Mahadsanid!",M,y);y+=8;
  doc.setFont("helvetica","normal");doc.setTextColor(60);doc.setFontSize(10);
  doc.text("Akoonkaagu wuu furan yahay ilaa: "+dmy(r.until),M,y);y+=6;
  doc.text("Caawimaad: WhatsApp +46 76 715 79 15",M,y);
  doc.setTextColor(140);doc.setFontSize(8);doc.text("HantiGo · Maamul lacagtaada meel kasta oo aad joogto.",W/2,287,{align:"center"});
  return doc.output("blob")}
function b64(blob){return new Promise((res,rej)=>{const f=new FileReader();f.onload=()=>res(String(f.result).split(",")[1]);f.onerror=rej;f.readAsDataURL(blob)})}
function toast(t,bad){let el=$("toast");if(!el){el=document.createElement("div");el.id="toast";el.style.cssText="position:fixed;left:50%;bottom:20px;transform:translateX(-50%);max-width:92vw;padding:12px 16px;border-radius:12px;color:#fff;font-weight:600;z-index:99;box-shadow:0 6px 20px rgba(0,0,0,.3)";document.body.appendChild(el)}
  el.style.background=bad?"#b3402a":"#16794a";el.textContent=t;el.hidden=false;clearTimeout(el._t);el._t=setTimeout(()=>el.hidden=true,bad?15000:7000)}
async function sendSubReceipt(id,days,amount){const p=rows.find(x=>x.id===id);if(!p?.email||!(amount>0))return;
  const now=new Date(),z=n=>String(n).padStart(2,"0");
  const r={no:"HG-"+String(now.getFullYear()).slice(2)+z(now.getMonth()+1)+z(now.getDate())+"-"+String(id).replace(/-/g,"").slice(0,4).toUpperCase(),date:now,days,amount,until:p.paid_until||new Date(Date.now()+days*864e5)};
  toast("🧾 Rasiidka waa la dirayaa…");
  try{const blob=await subPdf(p,r);
    const text=`Salaan,\n\nMahadsanid inaad iibsatay HantiGo.\n\nRasiid: ${r.no}\nTaariikhda: ${dmy(r.date)}\nAdeegga: HantiGo ${planName(p)} (${days>=365?"1 sano":days+" maalmood"})\nLacagta: $${amount.toFixed(2)} (${payWay(p)})\nAkoonkaagu wuu furan yahay ilaa: ${dmy(r.until)}\n\nRasiidka PDF-ka ah waa lifaaqan.\nCaawimaad: WhatsApp +46 76 715 79 15\n\nHantiGo`;
    const {data,error}=await sb.functions.invoke("send-receipt",{body:{to:p.email,subject:"HantiGo · Rasiidka lacag-bixinta "+r.no,text,company:"HantiGo",filename:"HantiGo-Rasiid-"+r.no+".pdf",pdf:await b64(blob)}});
    if(error||!data?.ok){let w=data?.error||error?.message||"";try{if(error?.context?.text)w=error.context.status+" "+await error.context.clone().text()}catch{}throw new Error(w)}
    toast("🧾 Rasiidka waa loo diray "+p.email+", nuqulna waa laguu soo diray.")}
  catch(e){toast("🧾 Rasiidka lama diri karin: "+String(e?.message||e).slice(0,160),true)}}
$("q").addEventListener("input",render);
(async()=>{const {data}=await sb.auth.getSession();
  if(!data.session){$("msg").innerHTML='Marka hore app-ka ku gal: <a href="./">Gal</a>';return}

  if(!me?.is_admin){$("msg").textContent="Boggan waxaa geli kara maamulaha oo keliya.";return}
